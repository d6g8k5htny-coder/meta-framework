name: Source contracts and architecture conformance
'on':
  pull_request:
    paths:
      - 'registry.json'
      - 'schemas/**'
      - 'examples/**'
      - 'tools/contract_validation.py'
      - 'tools/architecture_conformance.py'
      - 'tests/**'
      - '.github/workflows/catalog.yml'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run contract and conformance tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/discovery.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/discovery.log" || { echo "::error::unittest discovery collected 0 tests or returned no count"; exit 1; }
