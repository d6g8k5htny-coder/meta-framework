name: Source contracts and architecture conformance
'on':
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'tools/contract_validation.py'
      - 'tools/architecture_conformance.py'
      - 'tests/test_source_contracts.py'
      - 'tests/test_architecture_conformance.py'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run contract and conformance tests
        run: python -B -S -m unittest discover -s tests -p 'test_*.py' -v
