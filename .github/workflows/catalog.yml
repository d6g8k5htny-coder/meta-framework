name: Public catalog source verification
'on':
  pull_request:
    paths: ['registry.json', '.github/workflows/catalog.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check every real public entry and the corrected query controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B -S - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,re,subprocess,sys,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'catalog-evidence';out.mkdir()
          root=out/'workspace';root.mkdir()
          def fetch(repo,commit,path,size,digest):
              if repo not in {'Math-','meta-framework','query-','google-drive','trial'} or not re.fullmatch('[0-9a-f]{40}',commit): raise ValueError('unapproved source')
              pp=pathlib.PurePosixPath(path)
              if pp.is_absolute() or '..' in pp.parts or str(pp)!=path or '\\' in path or ':' in path: raise ValueError('unsafe path')
              if type(size) is not int or not 0<=size<=1000000 or not re.fullmatch('[0-9a-f]{64}',digest): raise ValueError('invalid identity')
              with urllib.request.urlopen(f'https://raw.githubusercontent.com/d6g8k5htny-coder/{repo}/{commit}/{path}',timeout=30) as response: raw=response.read(size+1)
              if len(raw)!=size or hashlib.sha256(raw).hexdigest()!=digest: raise ValueError('source mismatch: '+repo+'/'+path)
              dest=root/repo/path;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(raw)
              return dest
          if sys.version_info[:2]!=(3,11): raise ValueError('actual Python3.11 required')
          query=fetch('query-','8e201316d17cf4ff3c679e1e9906d4b016ac6730','research_query.py',5577,'54105dcd723e71b19263afc8f449a7d77b78cec27148f13603f33be7727e6b6b')
          test=fetch('trial','3aeea014cd08f532e632946fd533a1201adf261d','federation/test_federation.py',5192,'226a0375888a1ef88cf0f53653d99acfef5544f9323c317bd1b0cfa6dd041606')
          spec=importlib.util.spec_from_file_location('checked_query',query);q=importlib.util.module_from_spec(spec);spec.loader.exec_module(q)
          raw=pathlib.Path('registry.json').read_bytes();catpath=root/'meta-framework/registry.json';catpath.parent.mkdir(exist_ok=True);catpath.write_bytes(raw)
          data=q.load_catalog(catpath)
          if not 1<=len(data['artifacts'])<=128 or sum(row['bytes'] for row in data['artifacts'])>2000000: raise ValueError('catalog outside bounded job scope')
          for row in data['artifacts']:
              fetch(row['repository'],row['commit'],row['path'],row['bytes'],row['sha256'])
          checked=q.verify(data,root)
          env=dict(os.environ,FEDERATION_WORKSPACE=str(root))
          for mode,flags in [('normal',[]),('optimized',['-O'])]:
              p=subprocess.run([sys.executable,'-B',*flags,'-S','-m','unittest','-v','test_federation'],cwd=test.parent,env=env,capture_output=True,text=True,timeout=45)
              (out/(mode+'.stdout')).write_text(p.stdout);(out/(mode+'.stderr')).write_text(p.stderr)
              if p.returncode or 'Ran 20 tests' not in p.stderr or 'skipped=' in p.stderr: raise RuntimeError('actual federation tests failed')
          if q.verify(data,root)!=checked: raise RuntimeError('verification changed during tests')
          (out/'VERIFIED.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'python':sys.version,'catalog_sha256':hashlib.sha256(raw).hexdigest(),'artifact_count':len(data['artifacts']),'verified':checked['verified'],'distinct_tests':20,'modes':['normal','optimized'],'private_sources_fetched':False,'scope':'declared public payload identity and query behavior, not scientific acceptance'},indent=2)+'\n')
          print('ALL_DECLARED_PUBLIC_ARTIFACTS_VERIFIED',len(data['artifacts']))
          PY
      - name: Preserve actual evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-catalog-${{ github.run_id }}
          path: ${{ runner.temp }}/catalog-evidence
          if-no-files-found: error
          retention-days: 30
